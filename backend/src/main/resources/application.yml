spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/phishing_db
    username: postgres
    password: admin123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  cache:
    type: redis

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: localhost
    port: 25
    username: test-user
    password: test-password
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# 🛠️ FIXED STRUCTURE: Management keys grouped cleanly under root
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
  endpoint:
    health:
      show-details: always
  # 🔥 FIX: "health" must be indented directly under "management", not floating separately!
  health:
    mail:
      enabled: false
    status:
      order: "UP, DOWN"